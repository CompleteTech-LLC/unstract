# Optional local Qwen3 embedding services.
#
# The services are profile-gated so the normal development stack does not
# download multi-gigabyte model weights. CPU and GPU services deliberately have
# separate names, ports, caches, and containers so their benchmark results can
# be compared without changing an endpoint in place.

x-qwen3-healthcheck: &qwen3_healthcheck
  test:
    - CMD-SHELL
    - >-
      curl --fail --silent http://localhost:80/health >/dev/null ||
      exit 1
  interval: 15s
  timeout: 10s
  retries: 40
  start_period: 10m

x-qwen3-common: &qwen3_common
  restart: unless-stopped
  shm_size: 1gb
  expose:
    - "80"
  environment:
    HF_HOME: /data
    HF_HUB_DISABLE_TELEMETRY: "1"
    DO_NOT_TRACK: "1"
    HF_TOKEN: ${HF_TOKEN:-}
    TOKENIZERS_PARALLELISM: "false"
  labels:
    traefik.enable: "false"
  stop_grace_period: 30s
  healthcheck:
    <<: *qwen3_healthcheck

x-qwen3-cpu-image: &qwen3_cpu_image
  ${QWEN3_TEI_CPU_IMAGE:-ghcr.io/huggingface/text-embeddings-inference:cpu-1.9}

x-qwen3-gpu-image: &qwen3_gpu_image
  ${QWEN3_TEI_GPU_IMAGE:-ghcr.io/huggingface/text-embeddings-inference:cuda-1.9}

services:
  qwen3-embedding-06b-cpu:
    <<: *qwen3_common
    image: *qwen3_cpu_image
    container_name: unstract-qwen3-embedding-06b-cpu
    profiles:
      - embeddings-cpu
      - embeddings-both
    ports:
      - "127.0.0.1:${QWEN3_06B_CPU_PORT:-8101}:80"
    volumes:
      - qwen3_embedding_06b_cpu_cache:/data
    command:
      - --model-id
      - Qwen/Qwen3-Embedding-0.6B
      - --revision
      - ${QWEN3_06B_REVISION:-97b0c614be4d77ee51c0cef4e5f07c00f9eb65b3}
      - --served-model-name
      - qwen3-embedding-06b
      - --pooling
      - last-token
      - --max-batch-tokens
      - ${QWEN3_MAX_BATCH_TOKENS:-8192}
      - --max-client-batch-size
      - ${QWEN3_MAX_CLIENT_BATCH_SIZE:-32}
      - --max-concurrent-requests
      - ${QWEN3_MAX_CONCURRENT_REQUESTS:-4}
      - --tokenization-workers
      - ${QWEN3_TOKENIZATION_WORKERS:-4}

  qwen3-embedding-4b-cpu:
    <<: *qwen3_common
    image: *qwen3_cpu_image
    container_name: unstract-qwen3-embedding-4b-cpu
    profiles:
      - embeddings-cpu
      - embeddings-both
    ports:
      - "127.0.0.1:${QWEN3_4B_CPU_PORT:-8102}:80"
    volumes:
      - qwen3_embedding_4b_cpu_cache:/data
    command:
      - --model-id
      - Qwen/Qwen3-Embedding-4B
      - --revision
      - ${QWEN3_4B_REVISION:-5cf2132abc99cad020ac570b19d031efec650f2b}
      - --served-model-name
      - qwen3-embedding-4b
      - --pooling
      - last-token
      - --max-batch-tokens
      - ${QWEN3_MAX_BATCH_TOKENS:-8192}
      - --max-client-batch-size
      - ${QWEN3_MAX_CLIENT_BATCH_SIZE:-32}
      - --max-concurrent-requests
      - ${QWEN3_MAX_CONCURRENT_REQUESTS:-4}
      - --tokenization-workers
      - ${QWEN3_TOKENIZATION_WORKERS:-4}

  qwen3-embedding-8b-cpu:
    <<: *qwen3_common
    image: *qwen3_cpu_image
    container_name: unstract-qwen3-embedding-8b-cpu
    profiles:
      - embeddings-cpu
      - embeddings-both
    ports:
      - "127.0.0.1:${QWEN3_8B_CPU_PORT:-8103}:80"
    volumes:
      - qwen3_embedding_8b_cpu_cache:/data
    command:
      - --model-id
      - Qwen/Qwen3-Embedding-8B
      - --revision
      - ${QWEN3_8B_REVISION:-1d8ad4ca9b3dd8059ad90a75d4983776a23d44af}
      - --served-model-name
      - qwen3-embedding-8b
      - --pooling
      - last-token
      - --max-batch-tokens
      - ${QWEN3_MAX_BATCH_TOKENS:-8192}
      - --max-client-batch-size
      - ${QWEN3_MAX_CLIENT_BATCH_SIZE:-32}
      - --max-concurrent-requests
      - ${QWEN3_MAX_CONCURRENT_REQUESTS:-4}
      - --tokenization-workers
      - ${QWEN3_TOKENIZATION_WORKERS:-4}

  qwen3-embedding-06b-gpu:
    <<: *qwen3_common
    image: *qwen3_gpu_image
    container_name: unstract-qwen3-embedding-06b-gpu
    profiles:
      - embeddings-gpu
      - embeddings-both
    ports:
      - "127.0.0.1:${QWEN3_06B_GPU_PORT:-8201}:80"
    volumes:
      - qwen3_embedding_06b_gpu_cache:/data
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities:
                - gpu
    command:
      - --model-id
      - Qwen/Qwen3-Embedding-0.6B
      - --revision
      - ${QWEN3_06B_REVISION:-97b0c614be4d77ee51c0cef4e5f07c00f9eb65b3}
      - --served-model-name
      - qwen3-embedding-06b
      - --dtype
      - float16
      - --pooling
      - last-token
      - --max-batch-tokens
      - ${QWEN3_MAX_BATCH_TOKENS:-8192}
      - --max-client-batch-size
      - ${QWEN3_MAX_CLIENT_BATCH_SIZE:-32}
      - --max-concurrent-requests
      - ${QWEN3_MAX_CONCURRENT_REQUESTS:-4}
      - --tokenization-workers
      - ${QWEN3_TOKENIZATION_WORKERS:-4}

  qwen3-embedding-4b-gpu:
    <<: *qwen3_common
    image: *qwen3_gpu_image
    container_name: unstract-qwen3-embedding-4b-gpu
    profiles:
      - embeddings-gpu
      - embeddings-both
    ports:
      - "127.0.0.1:${QWEN3_4B_GPU_PORT:-8202}:80"
    volumes:
      - qwen3_embedding_4b_gpu_cache:/data
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities:
                - gpu
    command:
      - --model-id
      - Qwen/Qwen3-Embedding-4B
      - --revision
      - ${QWEN3_4B_REVISION:-5cf2132abc99cad020ac570b19d031efec650f2b}
      - --served-model-name
      - qwen3-embedding-4b
      - --dtype
      - float16
      - --pooling
      - last-token
      - --max-batch-tokens
      - ${QWEN3_MAX_BATCH_TOKENS:-8192}
      - --max-client-batch-size
      - ${QWEN3_MAX_CLIENT_BATCH_SIZE:-32}
      - --max-concurrent-requests
      - ${QWEN3_MAX_CONCURRENT_REQUESTS:-4}
      - --tokenization-workers
      - ${QWEN3_TOKENIZATION_WORKERS:-4}

  qwen3-embedding-8b-gpu:
    <<: *qwen3_common
    image: *qwen3_gpu_image
    container_name: unstract-qwen3-embedding-8b-gpu
    profiles:
      - embeddings-gpu
      - embeddings-both
    ports:
      - "127.0.0.1:${QWEN3_8B_GPU_PORT:-8203}:80"
    volumes:
      - qwen3_embedding_8b_gpu_cache:/data
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities:
                - gpu
    command:
      - --model-id
      - Qwen/Qwen3-Embedding-8B
      - --revision
      - ${QWEN3_8B_REVISION:-1d8ad4ca9b3dd8059ad90a75d4983776a23d44af}
      - --served-model-name
      - qwen3-embedding-8b
      - --dtype
      - float16
      - --pooling
      - last-token
      - --max-batch-tokens
      - ${QWEN3_MAX_BATCH_TOKENS:-8192}
      - --max-client-batch-size
      - ${QWEN3_MAX_CLIENT_BATCH_SIZE:-32}
      - --max-concurrent-requests
      - ${QWEN3_MAX_CONCURRENT_REQUESTS:-4}
      - --tokenization-workers
      - ${QWEN3_TOKENIZATION_WORKERS:-4}

volumes:
  qwen3_embedding_06b_cpu_cache:
  qwen3_embedding_4b_cpu_cache:
  qwen3_embedding_8b_cpu_cache:
  qwen3_embedding_06b_gpu_cache:
  qwen3_embedding_4b_gpu_cache:
  qwen3_embedding_8b_gpu_cache:
