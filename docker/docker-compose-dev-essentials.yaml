services:
  db:
    image: "pgvector/pgvector:pg15"
    container_name: unstract-db
    restart: unless-stopped
    # set shared memory limit when using docker-compose
    shm_size: 128mb
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data/
      - ./scripts/db-setup/db_setup.sh:/docker-entrypoint-initdb.d/db_setup.sh
    env_file:
      - ./essentials.env
    labels:
      - traefik.enable=false

  redis:
    image: "redis:7.2.3"
    container_name: unstract-redis
    restart: unless-stopped
    # uncomment below command if persistance required.
    #command: redis-server --save 20 1 --loglevel warning --
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    labels:
      - traefik.enable=false

  minio:
    image: "minio/minio:latest"
    container_name: unstract-minio
    hostname: minio
    restart: unless-stopped
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    env_file:
      - ./essentials.env
    command: server /data --console-address ":9001"
    labels:
      - traefik.enable=true
      - traefik.http.routers.minio.rule=Host(`minio.unstract.localhost`)
      - traefik.http.services.minio.loadbalancer.server.port=9001

  minio-bootstrap:
    image: minio/mc
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      sleep 5;
      mc alias set minio http://unstract-minio:9000 minio minio123;
      mc mb minio/unstract;
      mc mirror /app/prompt-studio-data minio/unstract/prompt-studio-data;
      exit 0;
      "
    volumes:
      - prompt_studio_data:/app/prompt-studio-data

  reverse-proxy:
    # The official v2 Traefik docker image
    image: traefik:v3.6.2
    container_name: unstract-proxy
    restart: unless-stopped
    # - Enables the web UI.
    # - Tells Traefik to use docker and file providers.
    # - Direct Traefik to the correct network for docker provider.
    #   This is required because Traefik by default tries available networks in a
    #   round-robin fashion. With multiple providers, services can be on multiple
    #   networks causing 504 Gateway Timeout.
    command: --api.insecure=true
      --accesslog=true --log.level=INFO
      --providers.docker=true --providers.docker.network=unstract-network
      --providers.file.filename=/proxy_overrides.yaml --providers.file.watch=true
    ports:
      # The HTTP port
      - "80:80"
      # The Web UI (enabled by --api.insecure=true)
      - "8080:8080"
    volumes:
      # So that Traefik can listen to the Docker events
      - /var/run/docker.sock:/var/run/docker.sock
      # Proxy overrides for components run directly in Docker host
      - ./proxy_overrides.yaml:/proxy_overrides.yaml
    # Since any proxy overrides need to point to Docker host for relevant routes.
    extra_hosts:
      # "host-gateway" is a special string that translates to host docker0 i/f IP.
      - "host.docker.internal:host-gateway"

  feature-flag:
    image: docker.flipt.io/flipt/flipt:v2.3.1
    container_name: unstract-flipt
    restart: unless-stopped
    ports: # Forwarded to available host ports
      - "8082:8080" # REST API port
      - "9005:9000" # gRPC port
    volumes:
      - flipt_data:/var/opt/flipt
    labels:
      - traefik.enable=true
      - traefik.http.routers.feature-flag.rule=Host(`feature-flag.unstract.localhost`)
      - traefik.http.services.feature-flag.loadbalancer.server.port=8080

  unstructured-io:
    profiles:
      - optional
    image: downloads.unstructured.io/unstructured-io/unstructured-api:0.0.61
    container_name: unstract-unstructured-io
    restart: unless-stopped
    ports: # Forwarded to available host ports
      - "8083:8000"
    labels:
      - traefik.enable=false

  qdrant:
    # Vector DB for doc indexer.
    # Server minor version must track qdrant-client pin in unstract/sdk1/pyproject.toml;
    # the 1.16 client calls endpoints the 1.8 server lacks and returns 404 with empty body.
    image: "qdrant/qdrant:v1.16.1"
    container_name: unstract-vector-db
    restart: unless-stopped
    ports:
      - "127.0.0.1:6333:6333"
    volumes:
      - qdrant_data:/var/lib/qdrant/data/
    labels:
      - traefik.enable=false

  # Separate pgvector instance for the Postgres adapter. The platform's `db`
  # service is also pgvector-enabled, but keeping this volume/container
  # independent prevents adapter connection tests from sharing platform data.
  postgres-vector:
    image: "pgvector/pgvector:pg15"
    container_name: unstract-postgres-vector
    restart: unless-stopped
    shm_size: 128mb
    # Generate a local self-signed certificate before the official Postgres
    # entrypoint initializes or starts the server.
    entrypoint: ["/usr/local/bin/postgres-vector-entrypoint.sh"]
    command: ["postgres"]
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres_vector_data:/var/lib/postgresql/data/
      - postgres_vector_ssl:/var/lib/postgresql/ssl/
      - ./scripts/db-setup/vector_db_setup.sh:/docker-entrypoint-initdb.d/vector_db_setup.sh:ro
      - ./scripts/db-setup/postgres-vector-entrypoint.sh:/usr/local/bin/postgres-vector-entrypoint.sh:ro
    env_file:
      # Reuse the local platform database credentials from essentials.env while
      # retaining a separate data directory and container.
      - ./essentials.env
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    labels:
      - traefik.enable=false

  # Weaviate uses anonymous access for this loopback-only development service.
  # The adapter uses the local connector for this HTTP endpoint; no cloud
  # account or API key is required.
  weaviate:
    image: "docker.io/semitechnologies/weaviate:1.39.2"
    container_name: unstract-weaviate
    restart: unless-stopped
    command:
      - --host
      - 0.0.0.0
      - --port
      - "8080"
      - --scheme
      - http
    ports:
      - "127.0.0.1:8084:8080"
      - "127.0.0.1:50051:50051"
    volumes:
      - weaviate_data:/var/lib/weaviate
    environment:
      QUERY_DEFAULTS_LIMIT: "25"
      AUTHENTICATION_ANONYMOUS_ACCESS_ENABLED: "true"
      PERSISTENCE_DATA_PATH: "/var/lib/weaviate"
      DEFAULT_VECTORIZER_MODULE: "none"
      CLUSTER_HOSTNAME: "node1"
    labels:
      - traefik.enable=false

  # Milvus standalone needs etcd for metadata and MinIO for object storage.
  # Keep those dependencies private to this Compose network; only Milvus's
  # client and WebUI ports are published for local development.
  milvus-etcd:
    image: "quay.io/coreos/etcd:v3.5.18"
    container_name: unstract-milvus-etcd
    restart: unless-stopped
    environment:
      ETCD_AUTO_COMPACTION_MODE: revision
      ETCD_AUTO_COMPACTION_RETENTION: "1000"
      ETCD_QUOTA_BACKEND_BYTES: "4294967296"
      ETCD_SNAPSHOT_COUNT: "50000"
    volumes:
      - milvus_etcd_data:/etcd
    command: >-
      etcd -advertise-client-urls=http://milvus-etcd:2379
      -listen-client-urls http://0.0.0.0:2379 --data-dir /etcd
    healthcheck:
      test: ["CMD", "etcdctl", "endpoint", "health"]
      interval: 30s
      timeout: 20s
      retries: 3
    labels:
      - traefik.enable=false

  milvus-minio:
    image: "minio/minio:RELEASE.2024-05-28T17-19-04Z"
    container_name: unstract-milvus-minio
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
      # Keep the legacy names aligned with the credentials expected by the
      # Milvus 2.5 standalone configuration.
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
    volumes:
      - milvus_minio_data:/minio_data
    command: minio server /minio_data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3
    labels:
      - traefik.enable=false

  milvus:
    # Keep this aligned with the pymilvus 2.5.x dependency used by sdk1.
    image: "milvusdb/milvus:v2.5.17"
    container_name: unstract-milvus
    restart: unless-stopped
    command: ["milvus", "run", "standalone"]
    security_opt:
      - seccomp:unconfined
    environment:
      MINIO_REGION: us-east-1
      ETCD_ENDPOINTS: milvus-etcd:2379
      MINIO_ADDRESS: milvus-minio:9000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
    volumes:
      - milvus_data:/var/lib/milvus
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9091/healthz"]
      interval: 30s
      start_period: 90s
      timeout: 20s
      retries: 3
    ports:
      - "127.0.0.1:19530:19530"
      - "127.0.0.1:9091:9091"
    depends_on:
      milvus-etcd:
        condition: service_healthy
      milvus-minio:
        condition: service_healthy
    labels:
      - traefik.enable=false

  rabbitmq:
    image: rabbitmq:4.1.0-management
    container_name: unstract-rabbitmq
    hostname: unstract-rabbit
    restart: unless-stopped
    env_file:
      - ./essentials.env
    ports:
      - "5672:5672" # AMQP port
      - "15672:15672" # Management UI port
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq

volumes:
  flipt_data:
  minio_data:
  postgres_data:
  postgres_vector_data:
  postgres_vector_ssl:
  qdrant_data:
  redis_data:
  prompt_studio_data:
  rabbitmq_data:
  weaviate_data:
  milvus_etcd_data:
  milvus_minio_data:
  milvus_data:
